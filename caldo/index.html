<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<meta name="description" content="Standing-seam roof systems hand-fitted by master craftsmen, backed by a lifetime transferable warranty." />

<meta property="og:title" content="STRATA: Roofing, Engineered to Outlast the Weather" />
<meta property="og:description" content="Standing-seam roof systems hand-fitted by master craftsmen, backed by a lifetime transferable warranty." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="./favicon.ico" sizes="any" />
<link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css" />

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
</head>
<body>
  <div id="app-fixed-root"></div>
  <main id="page">
    <div id="page-top-root"></div>

    <section class="scrolly" id="roofbuild">
      <div class="pin">
        <div class="mark" aria-hidden="true">STRATA</div>
        <div class="stage">
          <canvas id="gl" aria-label="3D standing-seam roof separating into its layers"></canvas>
          <div class="fallback" id="roofbuild-fallback" hidden>3D view isn't available in this browser.</div>
        </div>
        <div class="copy">
          <div class="eyebrow">Inside a STRATA roof</div>
          <h2 class="title">Six layers between you and the weather.</h2>
          <ol class="steps" id="roofbuild-steps"></ol>
          <div class="hint" id="roofbuild-hint">Scroll to take the roof apart</div>
          <div class="bar"><i id="roofbuild-bar"></i></div>
        </div>
      </div>
    </section>

    <div id="page-bottom-root"></div>
  </main>
  <footer id="footer"><div id="footer-root"></div></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="./roofbuild.js"></script>
  <script type="module" src="./main.js"></script>
</body>
